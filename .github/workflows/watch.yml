name: Watch inbox

# מקבל אימון מה-Apple Watch דרך Shortcuts באייפון ומוסיף אותו ל-inbox.json.
# הטלפון שולח POST יחיד ל-repository_dispatch — בלי sha, בלי base64, בלי התנגשויות.

on:
  repository_dispatch:
    types: [workout]

permissions:
  contents: write

concurrency:
  group: watch-inbox
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append workout
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(process.env.PAYLOAD || "{}");

            /* --- אימות קלט: הטלפון הוא מקור חיצוני, לא סומכים עליו --- */
            const num = (v, lo, hi) => {
              const x = parseFloat(v);
              return Number.isFinite(x) && x >= lo && x <= hi ? x : null;
            };
            const str = (v, max) => typeof v === "string" ? v.slice(0, max) : "";

            const start = str(raw.start, 40);
            const date  = (str(raw.date, 10) || start.slice(0, 10));
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { console.log("תאריך לא תקין — דולג:", date); process.exit(0); }

            /* --- איזה ענף? נקבע כאן ולא בטלפון ---
               הקיצור שולח את שלושת המרחקים כפי שהם ב-Health ואינו מחליט
               כלום. תנאים ב-Shortcuts הם המקום שבו דברים נשברים בשקט,
               וכאן אפשר לבדוק את הכלל הזה בלי אייפון.                 */
            const dBike = num(raw.d_bike, 0, 1000) || 0;   /* ק"מ   */
            const dRun  = num(raw.d_run,  0, 1000) || 0;   /* ק"מ   */
            const dSwim = num(raw.d_swim, 0, 100000) || 0; /* מטרים */
            let type = str(raw.type, 40), dist = num(raw.dist, 0, 100000);
            if (!type || dist == null) {
              if      (dSwim >= 50)  { type = type || "swim"; dist = dist ?? Math.round(dSwim); }
              else if (dBike >= 0.3) { type = type || "bike"; dist = dist ?? +dBike.toFixed(2); }
              else if (dRun  >= 0.3) { type = type || "run";  dist = dist ?? +dRun.toFixed(2);  }
              else                   { type = type || "str";  }
            }

            const it = {
              id:    str(raw.id, 80) || `${date}-${type}-${start.slice(11,16)}`,
              date, start,
              end:   str(raw.end, 40),
              type,
              dur:   num(raw.dur,   1, 1200),      /* דקות */
              dist,                                /* ק"מ, ובשחייה מטרים */
              hr:    num(raw.hr,   40, 220),
              rpe:   num(raw.rpe,    1, 10),
              sleep: num(raw.sleep,  0, 24),
              src:   "watch",
              got:   new Date().toISOString()
            };
            if (it.dur == null) { console.log("אין משך — דולג"); process.exit(0); }

            let box = {items:[]};
            try { box = JSON.parse(fs.readFileSync("inbox.json", "utf8")); } catch (e) {}
            if (!Array.isArray(box.items)) box.items = [];

            if (box.items.some(x => x && x.id === it.id)) { console.log("כבר קיים:", it.id); process.exit(0); }

            box.items.push(it);
            /* שומרים 60 אחרונים — התיבה אינה ארכיון, log.json הוא הארכיון */
            box.items.sort((a,b) => String(a.date).localeCompare(String(b.date)));
            if (box.items.length > 60) box.items = box.items.slice(-60);

            fs.writeFileSync("inbox.json", JSON.stringify(box, null, 1) + "\n");
            console.log("נוסף:", it.id, it.type, it.dur + " דק׳", it.hr ? it.hr + " דופק" : "");
          '

      - name: Commit
        run: |
          git config user.name  "Vichy Watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox.json
          if git diff --staged --quiet; then echo "אין שינוי"; exit 0; fi
          git commit -m "watch: workout received $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
            sleep 3
          done
          exit 1
